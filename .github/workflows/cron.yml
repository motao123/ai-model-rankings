name: Update Rankings

on:
  schedule:
    # 每天 UTC 0 点抓取一次（北京时间 08:00）
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 支持手动触发，调试必备

# 允许工作流把数据文件提交回仓库，并把降级情况同步成 Issue
permissions:
  contents: write
  issues: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and merge rankings
        run: python src/main.py

      # 每日刷新 sitemap 的 lastmod，向搜索引擎传递"内容有更新"的新鲜度信号
      - name: Refresh sitemap lastmod
        run: |
          today=$(date -u '+%Y-%m-%d')
          sed -i -E "s#<lastmod>[0-9-]+</lastmod>#<lastmod>${today}</lastmod>#" sitemap.xml
          echo "sitemap lastmod -> ${today}"

      # 自愈闭环：把降级/失败同步成 Issue；恢复时自动关闭。
      # 不阻断流程（降级是设计内的容错行为），仅做人工可见的提醒。
      - name: Report degraded sources (auto-issue)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/report_issue.py

      # 人工兜底数据的过期提醒：data/manual/ 手工维护、会随时间变旧，
      # 超过阈值（默认 45 天未复核）时自动开/更新 manual-stale Issue。
      - name: Check manual fallback freshness (auto-issue)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/check_manual.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update rankings data [skip ci] - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
